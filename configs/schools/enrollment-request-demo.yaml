scheduling:
  navigation:
    layout: school
    features: [lessons, workshops, camps, reservations]
    simplified: true
    single_location: true
  workflows:
    teacher_self_service: true
    direct_enrollment: true
    enrollment_linking: false
    optional_features: []
    lesson_changes: single
    reschedule_reason_required: false
    class_setup: requests

school:
  slug: "enrollment-request-demo"
  display_name: "Riverside Learning Academy"
  website_url: ""
  source_url: ""

form:
  title: "Enrollment Application"
  description: >
    Complete this form to begin the enrollment process.
    We’ll review your application and follow up with next steps within 1–2 business days.

  sections:
    - title: "Student Information"
      fields:
        - key: student_first_name
          label: "Student First Name"
          type: text
          required: true

        - key: student_last_name
          label: "Student Last Name"
          type: text
          required: true

        - key: date_of_birth
          label: "Date of Birth"
          type: date
          required: false

        - key: age
          label: "Age"
          type: number
          required: false
          readonly: true

    - title: "Program Interest"
      fields:
        - key: interested_in
          label: "Program / Class of Interest"
          type: select
          required: true

        - key: enrollment_type
          label: "Enrollment Type"
          type: select
          required: true
          options:
            - label: "Enroll now"
              value: enroll_now
            - label: "Returning student"
              value: returning

        - key: desired_start_date
          label: "Desired Start Date"
          type: select
          required: false
          options:
            - label: "As soon as possible"
              value: asap
            - label: "Within the next 2 weeks"
              value: two_weeks
            - label: "Within the next month"
              value: one_month
            - label: "Not sure yet"
              value: unsure

    - title: "Contact Information"
      fields:
        - key: guardian_name
          label: "Parent / Guardian Full Name"
          type: text
          required: false

        - key: contact_email
          label: "Primary Email Address"
          type: email
          required: true

        - key: contact_phone
          label: "Primary Phone Number"
          type: tel
          required: false

    - title: "Additional Notes"
      fields:
        - key: notes
          label: "Anything else we should know?"
          type: textarea
          required: false

branding:
  logo_url: "/static/demo/riverside-mark.svg"
  theme:
    primary_color: "#2b6a72"
    accent_color: "#2b6a72"

success:
  title: "Submitted!"
  message: "Thanks — we received your enrollment request. We’ll follow up with next steps."
  response_time: "1–2 business days"
  next_steps:
    - "We’ll review your details and confirm program fit."
    - "If needed, we’ll schedule a quick call or trial class."
    - "We’ll send final enrollment + payment instructions."
  contact:
    name: "Front Desk"
    email: "info@example.com"
    phone: "(555) 123-4567"
  hours: "Mon–Fri, 9am–5pm"

  notifications:
    submission_email:
      to: ""
      cc: ""
      bcc: ""
      from_email: "noreply@mypontora.com"
      subject: "New submission: {{student_name}}"

    applicant_confirmation:
      enabled: true
      from_email: "noreply@mypontora.com"
      subject: "We received your application, {{student_name}}!"
      # message: ""   # optional — leave blank to use the default message

admin:
  require_enrollment_approval: true
  submission_statuses:
    - New
    - In Review
    - Contacted
    - Needs Follow Up
    - Archived
    - Enrolled
    - Closed
  default_submission_status: New
  lead_workflow:
    status_labels:
      trial_scheduled: Trial Scheduled
      trial_completed: Trial Completed
    filters:
      new_leads:
        label: "New"
        statuses:
          - new
      pipeline:
        label: "In Pipeline"
        statuses:
          - contacted
          - trial_scheduled
      won:
        label: "Enrolled"
        statuses:
          - enrolled
    transitions:
      new:
        - label: "Mark Contacted"
          status: contacted
        - label: "Lost"
          status: lost
      contacted:
        - label: "Trial Scheduled"
          status: trial_scheduled
        - label: "Lost"
          status: lost
      trial_scheduled:
        - label: "Lost"
          status: lost
      # enrolled is a terminal status set only by auto-conversion — no transitions from/to it


leads:
  form_title: "Request School Information"
  form_description: "Interested in our programs? Leave your details and a member of our team will reach out with enrollment information and next steps."
  cta_text: "Request Information"
  success_message: "Thanks for your interest! A member of our team will follow up within 1–2 business days."
  confirmation_enabled: true
  notify_to: ""

capacity:
  waitlist_message: "This program is currently full. We will contact you when a place becomes available."
  excluded_statuses:
    - Declined
    - Archived
exports: {}
