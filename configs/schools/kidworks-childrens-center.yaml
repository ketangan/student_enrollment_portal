schema_version: "1.0"

school:
  slug: "kidworks-childrens-center"
  display_name: "Kid Works Children's Center"
  website_url: "https://kidworkschildrenscenter.com/"
  source_url: "https://kidworkschildrenscenter.com/"

branding:
  logo_url: "https://i0.wp.com/kidworkschildrenscenter.com/wp-content/uploads/2024/01/kidworks_new_difffonts_gordsans-edited-1.png"
  custom_css: "schools/kidworks-childrens-center.css"

  theme:
    primary_color: "#f7e300"
    accent_color: "#663018"
    background: "#fdf9f3"
    card: "#ffffff"
    text: "#2d1a0a"
    muted: "#6e6e6e"
    border: "#e8d9c8"
    radius: "10px"
    font_family: "'Urbanist', sans-serif"
    heading_font: "'Asap Condensed', 'Urbanist', sans-serif"

program_field_key: "program_interest"

form:
  title: "Enrollment Application"
  description: >
    Complete this form to begin the enrollment process at Kid Works Children's Center. Our team
    will review your application and follow up within 1–2 business days to confirm availability
    and next steps.
  submit_button_text: "Submit Application"

  sections:

    - title: "Child Information"
      fields:
        - key: child_first_name
          label: "Child's First Name"
          type: text
          required: true

        - key: child_last_name
          label: "Child's Last Name"
          type: text
          required: true

        - key: date_of_birth
          label: "Date of Birth"
          type: date
          required: true

        - key: gender
          label: "Gender"
          type: select
          required: false
          options:
            - label: "Male"
              value: male
            - label: "Female"
              value: female
            - label: "Prefer not to say"
              value: not_specified

    - title: "Program Interest"
      fields:
        - key: program_interest
          label: "Program"
          type: select
          required: true

        - key: current_school
          label: "Current School or Daycare (if any)"
          type: text
          required: false

    - title: "Parent / Guardian Information"
      fields:
        - key: guardian_name
          label: "Parent / Guardian Full Name"
          type: text
          required: true

        - key: guardian_email
          label: "Parent / Guardian Email"
          type: email
          required: true

        - key: guardian_phone
          label: "Parent / Guardian Phone"
          type: tel
          required: true

        - key: relationship
          label: "Relationship to Child"
          type: select
          required: false
          options:
            - label: "Mother"
              value: mother
            - label: "Father"
              value: father
            - label: "Guardian"
              value: guardian
            - label: "Other"
              value: other

    - title: "Health & Logistics"
      fields:
        - key: potty_trained
          label: "Is your child potty trained?"
          type: select
          required: false
          options:
            - label: "Yes"
              value: "yes"
            - label: "In progress"
              value: in_progress
            - label: "Not yet"
              value: no

        - key: allergies
          label: "Allergies or Dietary Restrictions"
          type: textarea
          required: false

        - key: special_needs
          label: "Any special needs, accommodations, or notes for our teachers?"
          type: textarea
          required: false

    - title: "Additional Information"
      fields:
        - key: how_did_you_hear
          label: "How did you hear about us?"
          type: select
          required: false
          options:
            - label: "Referral from a friend or family"
              value: referral
            - label: "Google search"
              value: google
            - label: "Social media"
              value: social_media
            - label: "Drove by / neighborhood"
              value: drove_by
            - label: "Community event"
              value: community_event
            - label: "Other"
              value: other

        - key: notes
          label: "Anything else you'd like us to know?"
          type: textarea
          required: false

    - title: "Policies & Acknowledgments"
      fields:
        - key: enrollment_policies
          label: "Enrollment Policies"
          type: waiver
          text: "Please review the Kid Works Children's Center enrollment policies and family handbook before submitting."
          link_url: "https://kidworkschildrenscenter.com/"
          link_text: "View Enrollment Policies"
          checkbox_label: "I have read and agree to the Kid Works enrollment policies and family handbook"
          required: true
          full_width: true

        - key: photo_release
          label: "Photo & Media Release"
          type: radio
          required: true
          full_width: true
          description: "Kid Works may photograph or record children during daily activities, field trips, and events for use on our website and social media. Do you grant permission to use photos or videos of your child?"
          options:
            - label: "Yes, I grant permission"
              value: grant
            - label: "No, I do not grant permission"
              value: deny

        - key: emergency_authorization
          label: "Emergency Authorization"
          type: checkbox
          required: true
          full_width: true
          checkbox_label: "I authorize Kid Works Children's Center staff to take appropriate emergency action, including contacting emergency services, if my child requires immediate medical attention and I cannot be reached."

success:
  title: "Application Received!"
  message: >
    Thank you — Kid Works Children's Center has received your enrollment application.
    Our team will review your child's information and follow up within 1–2 business days
    to discuss availability, scheduling, and next steps.
  response_time: "1–2 business days"
  next_steps:
    - "Our team will review your child's age, program interest, and any special needs noted."
    - "Use your application status page to choose a one-hour child playdate, or contact the school for help."
    - "The school will confirm whether a place is available or your application will join the waitlist."
    - "If a place is offered, the school will provide the remaining paperwork and payment instructions. Submitting this application does not confirm enrollment."
  contact:
    name: "Kid Works Children's Center"
    email: "Info@KidWorksChildrensCenter.com"
    phone: "(562) 438-4904"
  hours: "Mon–Fri, 8am–5pm"

  notifications:
    submission_email:
      to: "Info@KidWorksChildrensCenter.com"
      cc: ""
      bcc: ""
      from_email: "noreply@mypontora.com"
      subject: "New enrollment application: {{student_name}}"

    applicant_confirmation:
      enabled: true
      from_email: "noreply@mypontora.com"
      subject: "We received your application, {{student_name}}!"
      message: >
        We have received your application to Kid Works Children's Center. Use your
        application status page to choose a one-hour child playdate, or contact
        the school for help. Our team will review availability and confirm the
        next steps. Submitting an application does not confirm enrollment or
        require payment; fees and remaining paperwork follow an offer of a place.

admin:
  require_enrollment_approval: true
  submission_statuses:
    - New
    - In Review
    - Playdate Scheduled
    - Playdate Completed
    - Fee Pending
    - Enrolled
    - Waitlisted
    - Declined
    - Archived
  default_submission_status: New

  submission_workflow:
    filters:
      new_registrations:
        label: "New"
        statuses: ["New"]
      review:
        label: "In Review"
        statuses: ["In Review"]
      playdate:
        label: "Playdate"
        statuses: ["Playdate Scheduled", "Playdate Completed"]
      fee_pending:
        label: "Fee Pending"
        statuses: ["Fee Pending"]
      enrolled:
        label: "Enrolled"
        statuses: ["Enrolled"]
      waitlisted:
        label: "Waitlisted"
        statuses: ["Waitlisted"]
      closed:
        label: "Closed"
        statuses: ["Declined", "Archived"]

  lead_workflow:
    status_labels:
      trial_scheduled: "Tour Scheduled"
      trial_completed: "Tour Completed"
    filters:
      new_leads:
        label: "New"
        statuses: [new]
      pipeline:
        label: "In Pipeline"
        statuses: [contacted, trial_scheduled, trial_completed]
      won:
        label: "Enrolled"
        statuses: [enrolled]
    transitions:
      new:
        - label: "Mark Contacted"
          status: contacted
        - label: "Confirm Tour"
          status: trial_scheduled
        - label: "Archive"
          status: lost
      contacted:
        - label: "Schedule Tour"
          status: trial_scheduled
        - label: "Archive"
          status: lost
      trial_scheduled:
        - label: "Complete Tour"
          status: trial_completed
        - label: "Archive"
          status: lost
      trial_completed:
        - label: "Archive"
          status: lost

family_portal:
  playdate:
    enabled: true
    notify_school: false
    timezone: America/Los_Angeles
    slots:
      - "2026-10-12T09:00:00-07:00"
      - "2026-10-14T10:00:00-07:00"
      - "2026-10-16T09:00:00-07:00"

leads:
  form_title: "Schedule a Tour"
  form_description: "Choose a time to visit Kid Works. These are sample tour times for the demo; no real appointment is booked."
  cta_text: "Schedule Tour"
  success_message: "Your demo tour is scheduled for the date and time you selected. No real appointment has been booked."
  confirmation_enabled: true
  notify_to: ""
  appointment_field: tour_slot
  appointment_auto_confirm: true
  fields:
    - key: tour_slot
      label: "Tour date & time"
      type: select
      required: true
      options:
        - value: "2026-10-06T09:30:00-07:00"
          label: "Tue, Oct 6, 2026 at 9:30 AM"
        - value: "2026-10-08T10:30:00-07:00"
          label: "Thu, Oct 8, 2026 at 10:30 AM"
        - value: "2026-10-09T14:00:00-07:00"
          label: "Fri, Oct 9, 2026 at 2:00 PM"

capacity:
  waitlist_message: "This program is currently at capacity. You've been added to our waitlist — we'll be in touch as soon as a spot opens."
  excluded_statuses:
    - Archived
    - Declined
  programs:
    bungalow_full_day: 8
    bungalow_half_day: 10
    garden_room_full_day: 10
    garden_room_half_day: 12
    sun_room_full_day: 12
    sun_room_half_day: 14
