{% extends 'scheduling/base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_heading %}<div class="booking-page-heading"><h1>Change Password</h1><p>{{ request.user.get_full_name|default:request.user.username }}</p></div>{% endblock %}
{% block content %}
<form method="post" class="booking-password-form" style="max-width:440px">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions"><button type="submit" class="button primary">Update Password</button><a href="{% url 'scheduling:workspace' school_slug=business.slug %}">Cancel</a></div>
</form>
{% endblock %}
