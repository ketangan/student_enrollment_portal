{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Family schedule{% endblock %} | Pontora</title><link rel="icon" href="{% static 'favicon.png' %}"><link rel="stylesheet" href="{% static 'scheduling/workspace.css' %}"><link rel="stylesheet" href="{% static 'scheduling/family.css' %}"></head>
<body><a class="skip-link" href="#content">Skip to content</a><header class="topbar"><div class="brand"><img src="{% static 'pontora-wordmark-nav.png' %}" alt="Pontora" width="120" height="36"><span>{{ business|default:'Family schedules' }}</span></div>{% if grant and not preview %}<form method="post" action="{% url 'scheduling:family_sign_out' school_slug=business.slug %}">{% csrf_token %}<button type="submit">Close private access</button></form>{% endif %}</header>
<main id="content">{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
