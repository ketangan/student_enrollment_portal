<fieldset class="participant"><legend>Participant <span class="person-number">{{ forloop.counter|default:'1' }}</span></legend>
<div class="person-fields">{% for field in form %}<label data-field="{{ field.label }}">{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}</div>
{% include 'scheduling/catalog_picker.html' %}
<button class="remove-person quiet" type="button" title="Remove this participant"><i data-lucide="trash-2" aria-hidden="true"></i> Remove participant</button></fieldset>
