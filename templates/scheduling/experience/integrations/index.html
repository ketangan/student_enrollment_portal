{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>The Plushie Workshop | Booking integration options</title>
  <link rel="stylesheet" href="{% static 'scheduling/integrations/preview.css' %}">
  <link rel="stylesheet" href="{% static 'scheduling/integrations/options.css' %}">
</head>
<body>
  <a class="skip-link" href="#options">Skip to integration options</a>
  <header class="options-brand">
    <img src="/static/demo/plushumi/assets/logo.png" width="125" height="96" alt="The Plushie Workshop">
  </header>
  <main class="options-main">
    <header class="options-intro">
      <p class="eyebrow">Website integration</p>
      <h1>The Plushie Workshop</h1>
    </header>
    <section id="options" class="options-grid" aria-label="Integration options">
      <article class="option">
        <a class="option-image" href="inline.html" tabindex="-1" aria-hidden="true"><img src="{% static 'scheduling/integrations/booking-overview.png' %}" width="1280" height="900" alt=""></a>
        <div class="option-body">
          <span class="option-number">01</span>
          <h2>Booking page</h2>
          <a class="option-link" href="inline.html">Open booking page <span aria-hidden="true">&rarr;</span></a>
        </div>
      </article>
      <article class="option">
        <a class="option-image" href="modal.html" tabindex="-1" aria-hidden="true"><img src="{% static 'scheduling/integrations/modal-overview.png' %}" width="1280" height="900" alt=""></a>
        <div class="option-body">
          <span class="option-number">02</span>
          <h2>Open from a booking button</h2>
          <a class="option-link" href="modal.html">View popup preview <span aria-hidden="true">&rarr;</span></a>
        </div>
      </article>
    </section>
  </main>
  <footer class="site-footer"><span>Pontora x The Plushie Workshop</span></footer>
</body>
</html>
