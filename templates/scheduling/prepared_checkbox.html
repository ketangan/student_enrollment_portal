<button type="submit" class="prep-check" role="checkbox" aria-checked="{{ person.prepared|yesno:'true,false' }}" aria-label="Prepared: {{ person.name }}" {% if not writable or not person.selected %}disabled{% endif %} title="{% if not writable %}{% if person.prepared %}Prepared{% else %}Not prepared{% endif %}{% elif not person.selected %}Choose a design and color first{% elif person.prepared %}Mark not prepared{% else %}Mark prepared{% endif %}"><span>{% if person.prepared %}<i data-lucide="check" aria-hidden="true"></i>{% endif %}</span></button>
