<input type="hidden" name="{{ field.name }}" value="{{ field.value|default:'' }}">
{% for value, label in field.field.choices %}<button type="button" class="cf-option{% if value|stringformat:'s' == field.value|stringformat:'s' or not value and not field.value %} cf-active{% endif %}" data-filter-field="{{ field.name }}" data-filter-value="{{ value }}">{{ label }}</button>{% endfor %}
{{ field.errors }}
