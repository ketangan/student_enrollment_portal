{% extends 'scheduling/school/public_base.html' %}
{% load static %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'scheduling/family.css' %}">
  <style>
    .trial-dates { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .trial-dates a, .back-link { display: inline-flex; align-items: center; min-height: 44px; }
    .trial-dates a { padding: 0 8px; }
    .trial-dates [aria-current="date"] { font-weight: 700; text-decoration-thickness: 3px; }
    main { overflow-wrap: anywhere; }
    .family-filters > div { min-width: 0; }
    .family-filters input, .setup-form input { max-width: 100%; box-sizing: border-box; }
    .setup-form input { min-height: 44px; }
    .setup-form input[type="checkbox"] { min-height: 20px; }
    .setup-form .check-field label { display: flex; align-items: center; min-height: 44px; }
    .booking-slots label { min-height: 44px; box-sizing: border-box; }
    .school-public .booking-slots label:has(input:checked) { border-color: var(--journey-accent); background: #eff6ff; }
    .school-public input[type=radio] { accent-color: var(--journey-accent); }
  </style>
{% endblock %}
