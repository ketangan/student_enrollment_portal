{% for field in form.hidden_fields %}
{{ field }}
{% if field.errors %}<div class="notice error" role="alert">
  {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
  {% if field.name == 'edit_revision' %}<a href="{{ request.path }}">Reload saved settings</a>{% endif %}
</div>{% endif %}
{% endfor %}
