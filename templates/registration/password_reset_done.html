{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Check Your Email — Pontora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
  {% include 'partials/pwa_head.html' %}
  <link rel="stylesheet" href="{% static 'admin/dashboard.css' %}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--dash-bg-page,#f1f5f9); }
    .login-card { background:var(--dash-card,#fff); border:1px solid var(--dash-border,#e2e8f0); border-radius:12px; padding:40px 36px; width:100%; max-width:380px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .login-title { font-size:20px; font-weight:700; color:var(--dash-text,#0f172a); margin:0 0 6px; }
    .login-sub { font-size:13px; color:var(--dash-muted,#64748b); margin:0 0 20px; line-height:1.6; }
    .notice { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:14px 16px; font-size:13px; color:#166534; margin-bottom:20px; line-height:1.5; }
    .back-link { display:block; text-align:center; margin-top:8px; font-size:13px; color:var(--dash-muted,#64748b); text-decoration:none; }
    .back-link:hover { color:var(--dash-primary,#4f46e5); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">Pontora</div>
    <div class="login-sub">If an account exists for that email, we've sent a password reset link.</div>

    <div class="notice">
      Check your inbox and click the link to set your new password. The link is valid for 3 days.
    </div>

    <a href="{% url 'login' %}" class="back-link">← Back to sign in</a>
  </div>
</body>
</html>
