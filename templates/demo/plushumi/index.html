</style></head><body>
<div class="presentation"><div><strong>Pontora x The Plushie Workshop</strong> &nbsp; / &nbsp; Booking experience concepts</div><label>Screen <select id="screen-picker" aria-label="Choose mock screen"></select></label><span id="audience" class="audience"></span></div>
<div id="screen" class="screen"></div><div class="navbottom"><button id="prev"><i data-lucide="arrow-left"></i> Previous screen</button><span id="caption"></span><button id="next">Next screen <i data-lucide="arrow-right"></i></button></div>
<script src="{% static 'demo/plushumi/assets/lucide.js' %}"></script><script>
const I=n=>`<i class="icon" data-lucide="${n}"></i>`;
const designs=[['Unicorn','28%','0%'],['Cat','50%','0%'],['Bunny','74%','0%'],['Bear','50%','50%'],['Dog','74%','50%']];
const people=[{name:'Maya Chen',age:'9',design:'Cat',color:'Purple',x:'50%',y:'0%'},{name:'Leo Chen',age:'7',design:'Bear',color:'White',x:'50%',y:'50%'},{name:'Alex Chen',age:'Adult',design:'Bunny',color:'Beige',x:'74%',y:'0%'}];
const thumb=p=>`<div class="thumb" role="img" aria-label="${p.color} ${p.design} design reference" style="--x:${p.x};--y:${p.y}"></div>`;
const row=(p,edit=false)=>`<div class="selection">${thumb(p)}<div><strong>${p.name} <span class="muted tiny">· ${p.age==='Adult'?'Adult':'Age '+p.age}</span></strong><p>${p.design} / ${p.color}</p></div>${edit?'<a class="edit" href="?screen=1">Edit</a>':''}</div>`;
const header=()=>`<header class="brand"><div class="side"><button aria-label="Menu">${I('menu')}</button><span>Our workshops</span></div><img src="{% static 'demo/plushumi/assets/logo.png' %}" alt="The Plushie Workshop"><div class="side"><span>Pasadena, CA</span>${I('shopping-bag')}</div></header>`;
const progress=n=>`<div class="progress">${['Your workshop','Your plushies','Review & pay'].map((t,i)=>`<span class="${i===n?'active':i<n?'done':''}"><b>${i<n?'&#10003;':i+1}</b>${t}</span>`).join('')}</div>`;
const action=(label,to)=>`<a class="primary" href="?screen=${to}">${label} ${I('arrow-right')}</a>`;
const money=()=>`<div class="divider"><div class="line"><span>3 participants x $65</span><span>$195.00</span></div><div class="line total"><span>Subtotal</span><span>$195.00</span></div><p class="muted tiny">Any applicable tax is calculated at checkout.</p></div>`;
const summary=(images=false)=>`<aside class="summary">${images?'<img class="photo" src="{% static 'demo/plushumi/assets/workshop.jpg' %}" alt="Participants with their handmade plushies">':''}<h2>Your workshop</h2><p><strong>Plushie Making Workshop</strong><br><span class="muted">Pasadena, CA</span></p><p class="tiny">${I('calendar-days')} &nbsp; Sat, October 10, 2026<br><br>${I('clock-3')} &nbsp; 10:00 AM - 12:00 PM<br><br>${I('users')} &nbsp; 3 participants</p>${money()}</aside>`;
const foot=()=>'';
function session(){const nums=['28','29','30',...Array.from({length:31},(_,i)=>''+(i+1)),'1'];return header()+progress(0)+`<main><div class="eyebrow">Make something uniquely yours</div><h1>Let's plan your plushie day.</h1><p class="muted">Pick a workshop, then choose a plushie for each person coming along.</p><div class="columns"><section><div class="fields"><label class="field">Studio<select><option>Pasadena, CA</option><option>New York, NY</option><option>Houston, TX</option><option>Dallas, TX</option><option>Charlotte, NC</option></select></label><label class="field">Participants<select aria-label="Participants"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label></div><div class="session-schedule"><div class="calendar"><div class="calhead"><span>October 2026</span><span>${I('chevron-left')} &nbsp; ${I('chevron-right')}</span></div><div class="days">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(v=>`<span class="head">${v}</span>`).join('')}${nums.map((v,i)=>`<span class="${i===12?'selected':i<3||i===34?'faded':''}">${v}</span>`).join('')}</div></div><div class="session-times"><h3>Saturday, October 10</h3><div class="times"><button class="time selected">10:00 AM</button><button class="time">1:00 PM</button><button class="time">4:00 PM</button></div></div></div><div class="footer-actions">${action('Choose your plushies',1)}</div></section>${summary(true)}</div></main>`+foot()}
function visual(){return header()+progress(1)+`<main><div class="intro"><div><h1>A plushie for every personality.</h1><p class="muted">Choose a design and color for each participant.</p></div><span class="pill purple">Guided selection</span></div><div class="columns" style="margin-top:0"><section><div class="tabs"><button class="tab selected">1 &nbsp; Maya</button><button class="tab">2 &nbsp; Leo &nbsp; &#10003;</button><button class="tab">3 &nbsp; Alex &nbsp; &#10003;</button></div><div class="fields"><label class="field">Participant name<input value="Maya Chen"></label><label class="field">Age<input value="9"></label></div><h3>Choose a design</h3><div class="designs">${designs.map(d=>`<button class="design ${d[0]==='Cat'?'selected':''}"><div class="plush" style="--x:${d[1]};--y:${d[2]}"></div><strong>${d[0]}</strong>${d[0]==='Cat'?'<span class="chosen">&#10003;</span>':''}</button>`).join('')}</div><p class="tiny muted" style="margin-top:10px">Design references. Accessories pictured are not included. <u>View all 9 designs</u></p><div class="color-preview"><section><h3 style="margin-top:0">Choose a color <span class="muted tiny">/ Purple selected</span></h3><div class="colors">${[['White','#fafafa'],['Pink','#f6b3cd'],['Purple','#b99bd3'],['Blue','#9bcce8'],['Yellow','#f5db66'],['Brown','#906447'],['Beige','#d6c4a6'],['Grey','#aaa'],['Black','#333']].map(([n,c])=>`<button class="swatch ${n==='Purple'?'selected':''}" style="--color:${c}"><i></i>${n}</button>`).join('')}</div></section><figure class="selected-preview"><div class="preview-image" role="img" aria-label="Purple cat plushie preview"></div><figcaption><strong>Maya's plushie</strong><span><i class="preview-swatch"></i> Cat / Purple</span></figcaption></figure></div><div class="footer-actions divider"><a href="?screen=0" class="tiny">Back to workshop</a>${action('Review our booking',3)}</div></section><aside class="summary"><h2>Your group</h2><p class="tiny muted">Pasadena · Oct 10 · 10:00 AM</p>${people.map(p=>row(p)).join('')}<span class="pill green">${I('check')} 3 of 3 selections complete</span>${money()}</aside></div></main>`+foot()}
function group(){return header()+progress(1)+`<main><div class="intro"><div><h1>Your whole group, in one place.</h1><p class="muted">Each participant gets their own plushie. Mix designs and colors however you like.</p></div><span class="pill aqua">Alternative selection layout</span></div><div class="columns"><section><div class="tablewrap"><table class="group-table"><thead><tr><th>PARTICIPANT</th><th>AGE</th><th>DESIGN</th><th>COLOR</th></tr></thead><tbody>${people.map(p=>`<tr><td style="width:29%"><input value="${p.name}"></td><td style="width:14%"><input value="${p.age}"></td><td style="width:32%"><div class="inline">${thumb(p)}<select><option>${p.design}</option></select></div></td><td><select><option>${p.color}</option></select></td></tr>`).join('')}</tbody></table></div><div class="line"><span class="pill green">${I('check')} Everyone is ready</span><a href="?screen=1" class="tiny">Browse design photos</a></div><div class="divider"><h3>Keep it coordinated</h3><div class="fields"><label class="field">Group color<select><option>Keep individual colors</option><option>Purple</option><option>White</option></select></label><div style="padding-top:24px"><button class="secondary">Apply to everyone</button></div></div></div><div class="footer-actions divider"><a href="?screen=0" class="tiny">Back to workshop</a>${action('Review our booking',3)}</div></section>${summary(true)}</div></main>`+foot()}
function review(){return header()+progress(2)+`<main><h1>One last look before the fun.</h1><p class="muted">Check your group's choices, then finish your booking with Wix.</p><div class="columns"><section><div class="intro"><h2>Your plushie crew</h2><a class="tiny" href="?screen=1">Edit selections</a></div><div class="review-rows">${people.map(p=>row(p,true)).join('')}</div><div class="divider"><h3>Booking contact</h3><div class="fields"><label class="field">Full name<input value="Alex Chen"></label><label class="field">Email<input value="alex.chen@example.com"></label></div></div><div class="checks"><label><input type="checkbox" checked> I have read and accept the workshop waiver.</label><label><input type="checkbox" checked> I have read and accept the cancellation policy.</label></div></section><aside class="summary"><h2>Booking summary</h2><p><strong>Plushie Making Workshop</strong><br><span class="muted">Pasadena, CA</span></p><p class="tiny">Saturday, October 10, 2026<br>10:00 AM - 12:00 PM<br>3 participants</p>${money()}<a class="primary wide" href="?screen=4">${I('lock-keyhole')} Continue to Wix checkout</a><p class="tiny muted" style="margin-top:12px">Your workshop and plushie selections stay with this booking.</p></aside></div></main>`+foot()}
function confirmed(){return header()+`<main><div class="success"><div class="success-mark">${I('check')}</div><div class="eyebrow">Booking confirmation</div><h1>Your plushie day is on the calendar!</h1><p class="muted">Thanks, Alex. We have everyone's selections and can't wait to create with you.</p><span class="pill green">Confirmed</span> &nbsp; <span class="tiny muted">Booking PW-DEMO-1042</span></div><div class="confirmation"><div class="confirmation-grid"><section><h2>Your workshop</h2><p><strong>Pasadena studio</strong><br>Saturday, October 10, 2026<br>10:00 AM - 12:00 PM</p><p class="tiny muted">A confirmation is sent to alex.chen@example.com.</p><button class="secondary">${I('calendar-plus')} Add to calendar</button><div class="divider"><h3>All set for your visit</h3><p class="tiny muted">Your designs and colors are saved. No additional selection form to fill out.</p></div></section><section><h2>Meet your future plushies</h2>${people.map(p=>row(p)).join('')}<div class="note">Our team will prepare for your group's choices before you arrive.</div></section></div></div></main>`+foot()}
function staff(){return `<div class="prep-header"><span><strong>THE PLUSHIE WORKSHOP</strong> &nbsp; / &nbsp; Staff preparation concept</span><span class="pill purple">Proposed Notion view</span></div><div class="staff"><aside class="sidebar"><strong>Workshop operations</strong><div class="divider"></div><div class="navitem active">${I('calendar-days')} Reservations</div><div class="navitem">${I('package-check')} Session prep</div><div class="navitem">${I('map-pin')} Locations</div><div class="divider tiny muted">Pasadena<br><br>New York<br><br>Houston<br><br>Dallas<br><br>Charlotte</div></aside><main><div class="eyebrow">Pasadena / Saturday, October 10</div><div class="intro"><div><h1>Ready for the next workshop.</h1><p class="muted">10:00 AM - 12:00 PM</p></div><button class="secondary">${I('printer')} Print prep list</button></div><div class="metrics"><div><span class="tiny muted">Bookings</span><strong>1</strong></div><div><span class="tiny muted">Participants</span><strong>3</strong></div><div><span class="tiny muted">Selections received</span><strong>3 / 3</strong></div><div><span class="tiny muted">Missing selections</span><strong>0</strong></div></div><div class="staff-tabs"><span class="active">Participant prep</span><span>Reservations</span><span>By location</span></div><div class="tablewrap"><table class="group-table"><thead><tr><th>PARTICIPANT</th><th>AGE</th><th>PLUSHIE</th><th>COLOR</th><th>BOOKING</th><th>PREP STATUS</th></tr></thead><tbody>${people.map(p=>`<tr><td><strong>${p.name}</strong></td><td>${p.age}</td><td><div class="inline">${thumb(p)}${p.design}</div></td><td>${p.color}</td><td>PW-DEMO-1042</td><td><span class="pill pink">To prepare</span></td></tr>`).join('')}</tbody></table></div><div class="divider"><h2>Materials for this session</h2><div class="prep-counts">${people.map(p=>`<div class="prep-count"><strong>${p.design} / ${p.color}</strong><span class="muted">1 participant</span></div>`).join('')}</div></div><div class="note" style="background:#e8f8df;margin-top:25px"><strong>Wix → Notion:</strong> Booking details and participant selections arrive together. Changes update the same reservation.</div></main></div>`}
const screens=[['01 · Choose a workshop',session,'Step 1 / Session selection'],['02 · Choose plushies',visual,'Step 2 / Guided visual selection'],['03 · Group alternative',group,'Alternative for step 2 / Not an additional customer step'],['04 · Review booking',review,'Step 3 / Review, then hand off to Wix checkout'],['05 · Confirmation',confirmed,'Step 4 / After successful Wix checkout'],['06 · Staff preparation',staff,'Behind the scenes / Proposed Notion destination']];
const requestedScreen=Number(new URLSearchParams(location.search).get('screen'));
let index=Number.isInteger(requestedScreen)?Math.max(0,Math.min(5,requestedScreen)):0;
const picker=document.getElementById('screen-picker');screens.forEach(([label],i)=>picker.add(new Option(label,i)));picker.value=index;
const audience=document.getElementById('audience');audience.textContent=index===5?'PLUSHIE ADMIN SCREEN':'CUSTOMER SCREEN';audience.classList.toggle('admin',index===5);
document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===5;
document.getElementById('screen').innerHTML=screens[index][1]();document.getElementById('caption').textContent=screens[index][2];picker.onchange=()=>location.search='?screen='+picker.value;
document.getElementById('prev').onclick=()=>location.search='?screen='+Math.max(0,index-1);document.getElementById('next').onclick=()=>location.search='?screen='+Math.min(5,index+1);lucide.createIcons();
</script></body></html>
