{% extends "ops/base.html" %}
{% block page_title %}Website Mocks{% endblock %}

{% block content %}
<main class="dash-main" style="max-width:none;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap;">
    <div>
      <h1 style="font-size:20px;font-weight:700;margin:0 0 4px;">Website Mocks</h1>
      <p style="font-size:13px;color:var(--dash-muted);margin:0;">
        Review the generated mock index from mocks.mypontora.com.
      </p>
    </div>
    <a href="{{ mocks_url }}" target="_blank" rel="noopener"
       class="dash-action-btn dash-action-btn--secondary" style="font-size:12px;">
      Open full mock index
    </a>
  </div>

  <div class="dash-card" style="padding:0;overflow:hidden;">
    <iframe
      src="{{ mocks_url }}"
      title="Pontora website mocks"
      style="display:block;width:100%;height:calc(100vh - 190px);min-height:720px;border:0;background:#fff;"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <p style="font-size:12px;color:var(--dash-muted);margin:10px 2px 0;">
    If the embedded preview does not load, open the mock index in a new tab.
  </p>
</main>
{% endblock %}
