<div class="email-token-reference">
  <h3 style="font-size:11px;font-weight:700;color:var(--dash-muted);text-transform:uppercase;margin:0 0 8px;">Auto-filled Tokens</h3>
  {% for token, label in tokens %}
  <div style="margin-bottom:6px;">
    <button type="button" data-token="{{ token }}" title="Insert {{ label }}"
            style="font-family:monospace;font-size:11px;padding:4px 8px;border:1px solid var(--dash-border);border-radius:4px;background:var(--dash-bg);color:var(--dash-primary,#4f46e5);cursor:pointer;width:100%;text-align:left;">
      &#123;&#123;{{ token }}&#125;&#125;
    </button>
    <div style="font-size:11px;color:var(--dash-muted);margin-top:2px;padding-left:2px;">{{ label }}</div>
  </div>
  {% endfor %}
</div>
